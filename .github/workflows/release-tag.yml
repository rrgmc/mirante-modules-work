# Tags a release of these modules when a merged pull request raises VERSION,
# with the core's workflow. Apps pin these tags. The ref below must match the
# core's ref in ci/manifest.json. See decision 0134 in mirante-core.

name: Release tag
# Pull request runs lead with the number. Other runs keep GitHub's default
# title, because an empty run-name means the default.
run-name: ${{ github.event_name == 'pull_request' && format('#{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || '' }}

on:
  push:
    branches: [master]
  pull_request:
    paths: [VERSION, CHANGELOG.md]

permissions:
  contents: read

jobs:
  tag:
    permissions:
      contents: write
    uses: rrgmc/mirante-core/.github/workflows/tag-release.yml@68e3f8f5e327b2d6f85f17ea02ca050b50b53c2b
